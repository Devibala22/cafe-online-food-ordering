
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bean & Bite Cafe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">☕ Bean & Bite</div>
        <p>Fresh Food • Fresh Coffee • Happy Moments</p>
    </header>

    <!-- Main Content -->
    <main>

       <section class="menu-section">

    <div class="menu-header">
        <div>
            <h1>Our Menu</h1>
            <p class="subtitle">Choose from our freshly prepared dishes</p>
        </div>

        <button id="cart-button" class="cart-button">
            🛒 Cart <span id="cart-count">0</span>
        </button>
    </div>

    <div id="menu-container" class="menu-container"></div>

    <!-- Cart -->
    <div id="cart-section" class="cart-section">

        <h2>🛒 Your Cart</h2>

        <div id="cart-items">
            <p class="empty-cart">Your cart is empty.</p>
        </div>

        <div class="cart-total">
            <strong>Total:</strong>
            <span id="cart-total">₹0</span>
        </div>

    </div>

</section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Bean & Bite Cafe</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
