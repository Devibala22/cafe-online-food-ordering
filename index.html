
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean & Bite Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cafe header -->
    <header class="header">
        <h1>☕ Bean & Bite</h1>
        <p>Fresh Food • Fresh Coffee • Happy Moments</p>
    </header>

    <main class="container">

        <!-- Menu heading and cart count -->
        <section class="menu-heading">
            <div>
                <h2>Our Menu</h2>
                <p>Choose from our freshly prepared dishes</p>
            </div>

            <button class="cart-button" onclick="scrollToCart()">
                🛒 Cart <span id="cart-count">0</span>
            </button>
        </section>

        <!-- V3 food category filters -->
        <section class="filters">
            <button class="filter-btn active" data-filter="All">All</button>
            <button class="filter-btn" data-filter="Veg">Veg</button>
            <button class="filter-btn" data-filter="Non-Veg">Non-Veg</button>
        </section>

        <!-- Menu items are created using JavaScript -->
        <section id="menu" class="menu-grid"></section>

        <!-- Selected cart items -->
        <section id="cart-section" class="cart-section">
            <h2>🛒 Your Cart</h2>

            <div id="cart-items">
                <p class="empty-cart">Your cart is empty. Add something delicious!</p>
            </div>

            <div class="cart-total">
                <h3>Total:</h3>
                <h3 id="cart-total">₹0</h3>
            </div>
        </section>

    </main>

    <footer>
        <p>Bean & Bite Cafe | Fresh Food, Fresh Moments</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
